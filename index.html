<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Inclusiva — ONG Esporte Sem Limites</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Acessibilidade e Alto Contraste */
        :root { --font-scale: 16px; }
        html { font-size: var(--font-scale); scroll-behavior: smooth; }
        
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;
        }
        
        .skip-link:focus {
            position: fixed; top: 10px; left: 10px; z-index: 9999;
            background: #2563eb; color: #ffffff; padding: 15px;
            border-radius: 8px; font-weight: bold; outline: 4px solid #ffff00;
        }

        body.high-contrast { background-color: #000000 !important; color: #ffffff !important; }
        body.high-contrast .bg-white, body.high-contrast .bg-slate-50, body.high-contrast .bg-slate-900,
        body.high-contrast .bg-blue-50, body.high-contrast .bg-indigo-50, body.high-contrast .bg-teal-50 {
            background-color: #000000 !important; color: #ffffff !important; border-color: #ffff00 !important;
        }
        body.high-contrast .text-slate-900, body.high-contrast .text-slate-700, body.high-contrast .text-slate-600,
        body.high-contrast .text-slate-500, body.high-contrast .text-blue-600, body.high-contrast .text-indigo-600 {
            color: #ffff00 !important;
        }
        body.high-contrast button.bg-blue-600, body.high-contrast button.bg-indigo-600, body.high-contrast .bg-gradient-to-r {
            background: #ffff00 !important; color: #000000 !important; border: 2px solid #ffffff !important;
        }
        body.high-contrast input, body.high-contrast select, body.high-contrast textarea {
            background-color: #000000 !important; color: #ffff00 !important; border: 2px solid #ffff00 !important;
        }
        
        /* Validação de Formulário (Requisito do Professor) */
        .input-error {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2) !important;
        }
    </style>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Anunciador Dinâmico -->

        // ============================================================================
        // 2. SISTEMA SPA E ROTAS (AS 10 PÁGINAS EXIGIDAS)
        // ============================================================================
        function loadStoredUser() {
            const raw = localStorage.getItem('arena_user');
            return raw ? JSON.parse(raw) : null;
        }

        let state = {
            route: 'home',
            user: loadStoredUser(),
            favorites: JSON.parse(localStorage.getItem('arena_favs')) || [],
            fontSize: parseInt(localStorage.getItem('arena_font')) || 16,
            darkMode: localStorage.getItem('arena_dark') === 'true',
            highContrast: localStorage.getItem('arena_contrast') === 'true',
            quizStep: 1,
            quizData: { name: '', email: '', password: '', age: '', hasDisability: '', disabilityType: '', accessibilityNeeds: '', goals: ['Melhorar a saúde'], interest: 'Todos' }
        };

        const ROUTE_NAMES = {
            home: '1. Início', about: '2. Sobre a ONG', news: '3. Notícias', catalog: '4. Catálogo',
            contact: '5. Contato', donate: '6. Doações', login: '7. Login', register: '8. Cadastro',
            recommendations: '9. Recomendações', profile: '10. Meu Perfil'
        };

        function navigate(route) {
            state.route = route;
            document.getElementById('mobile-nav').classList.add('hidden');
            renderNav();
            renderMain();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            announceToScreenReader(`Navegou para a página: ${ROUTE_NAMES[route]}`);
            lucide.createIcons();
            readCurrentScreen(); // Lê automaticamente o topo da nova página se a voz estiver ativa
        }

        function renderNav() {
            const d = document.getElementById('desktop-nav');
            const m = document.getElementById('mobile-nav');
            
            const btnClass = (r) => `text-sm font-semibold px-2 py-1 rounded focus-visible:ring-4 focus-visible:ring-blue-500 transition ${state.route === r ? 'text-blue-600 dark:text-blue-400' : 'text-slate-600 dark:text-slate-300 hover:text-blue-600'}`;

            let links = `
                <button onclick="navigate('home')" class="${btnClass('home')}">Início</button>
                <button onclick="navigate('about')" class="${btnClass('about')}">Sobre Nós</button>
                <button onclick="navigate('news')" class="${btnClass('news')}">Notícias</button>
                <button onclick="navigate('catalog')" class="${btnClass('catalog')}">Catálogo</button>
                <button onclick="navigate('contact')" class="${btnClass('contact')}">Contato</button>
                <button onclick="navigate('donate')" class="${btnClass('donate')}">Doar</button>
            `;

            if (state.user) {
                links += `
                    <button onclick="navigate('recommendations')" class="${btnClass('recommendations')}">Recomendações</button>
                    <button onclick="navigate('profile')" class="${btnClass('profile')}">Meu Perfil</button>
                    <button aria-label="Sair da conta" onclick="logout()" class="ml-2 px-4 py-2 rounded-xl bg-red-50 text-red-600 hover:bg-red-100 text-sm font-bold transition focus-visible:ring-4 focus-visible:ring-red-500">Sair</button>
                `;
            } else {
                links += `
                    <button onclick="navigate('login')" class="${btnClass('login')}">Entrar</button>
                    <button onclick="navigate('register')" class="ml-2 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold shadow-md transition focus-visible:ring-4 focus-visible:ring-blue-500">Cadastro</button>
                `;
            }

            d.innerHTML = links;
            m.innerHTML = `<div class="flex flex-col space-y-2">${links}</div>`;
        }

        function logout() {
            state.user = null;
            localStorage.removeItem('arena_user');
            navigate('home');
        }

        function toggleMobileMenu() {
            document.getElementById('mobile-nav').classList.toggle('hidden');
        }

        // ============================================================================
        // 3. VALIDAÇÕES JS EXIGIDAS (Com bordas vermelhas e mensagens)
        // ============================================================================
        function setFieldError(id, msg) {
            const el = document.getElementById(id);
            const err = document.getElementById(id + '-error');
            el.classList.add('input-error');
            el.setAttribute('aria-invalid', 'true');
            err.textContent = msg;
            err.classList.remove('hidden');
        }

        function clearFieldError(id) {
            const el = document.getElementById(id);
            const err = document.getElementById(id + '-error');
            el.classList.remove('input-error');
            el.removeAttribute('aria-invalid');
            err.classList.add('hidden');
        }

        function validateLogin(e) {
            e.preventDefault();
            let valid = true;
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value.trim();

            if (!email.includes('@') || !email.includes('.')) {
                setFieldError('login-email', 'Informe um e-mail válido.'); valid = false;
            } else { clearFieldError('login-email'); }

            if (pass.length < 6) {
                setFieldError('login-pass', 'A senha precisa ter no mínimo 6 caracteres.'); valid = false;
            } else { clearFieldError('login-pass'); }

            if (!valid) {
                announceToScreenReader('Erros no formulário. Verifique os campos.'); return;
            }

            state.user = { name: email.split('@')[0], email, goals: ['Melhorar a saúde'], interest: 'Todos' };

        function validateContact(e) {
            e.preventDefault();
            let valid = true;
            const n = document.getElementById('cont-nome').value.trim();
            const em = document.getElementById('cont-email').value.trim();
            const msg = document.getElementById('cont-msg').value.trim();

            if (n.length < 3) { setFieldError('cont-nome', 'O nome é obrigatório.'); valid = false; } else { clearFieldError('cont-nome'); }
            if (!em.includes('@')) { setFieldError('cont-email', 'E-mail inválido.'); valid = false; } else { clearFieldError('cont-email'); }
            if (msg.length < 10) { setFieldError('cont-msg', 'A mensagem deve ter pelo menos 10 caracteres.'); valid = false; } else { clearFieldError('cont-msg'); }

            if (!valid) { announceToScreenReader('Erros no formulário de contato.'); return; }

            alert('Sua mensagem foi enviada à ONG com sucesso! Obrigado.');
            navigate('home');
        }

        function applyCatalogFilters() {
            const term = document.getElementById('cat-search').value.toLowerCase();
            const dis = document.getElementById('cat-dis').value;
            const type = document.getElementById('cat-type').value;

            const filtered = SPORTS.filter(s => {

                    && (!dis || s.disability.includes(dis))
                    && (!type || s.category === type);
            });

            const container = document.getElementById('catalog-results');
            if (filtered.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">Nenhum esporte encontrado.</p>`;
                announceToScreenReader('Nenhum esporte encontrado com esses filtros.');
            } else {
                container.innerHTML = filtered.map(s => createSportCard(s)).join('');
                announceToScreenReader(`${filtered.length} esportes exibidos.`);
            }
            lucide.createIcons();
        }

                state.quizData.name = n; state.quizData.email = em;

            } else { announceToScreenReader('Erros no formulário.'); }

            clearFieldError('q-hasDis');
            
            state.quizData.hasDisability = dis;
            state.quizData.disabilityType = document.getElementById('q-disType').value;
            state.quizStep = 3; renderMain();

        function finishWizard() {
            state.quizData.interest = document.getElementById('q-int').value;
            state.user = { ...state.quizData };
            localStorage.setItem('arena_user', JSON.stringify(state.user));
            state.quizStep = 1;
            navigate('recommendations');
        }

        // 9. RECOMENDAÇÕES INTELIGENTES
        function getRecommendations() {
            const u = state.user;
            return SPORTS.map(sport => {
                let score = 45;
                if (u.hasDisability === 'Sim' && u.disabilityType) {
                    if (sport.disability.includes(u.disabilityType)) score += 35;
                    else score += 10;
                } else score += 25;
                
                if (u.interest && u.interest !== 'Todos') {
                    if (sport.category === u.interest) score += 15;
                } else score += 10;
                return { ...sport, score: Math.min(score + 5, 98) };
            }).sort((a, b) => b.score - a.score);
        }

        function viewRecommendations() {
            const recs = getRecommendations();
            return `
                <div class="max-w-7xl mx-auto px-4 py-12">
                    <div class="bg-blue-600 rounded-3xl p-8 text-white shadow-xl mb-10">
                        <h1 class="text-3xl font-extrabold">Recomendações para ${state.user.name}</h1>
                        <p class="mt-2 opacity-90">Algoritmo da ONG calculou as modalidades com maior afinidade para o seu perfil.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${recs.map(s => createSportCard(s, true)).join('')}
                    </div>
                </div>
            `;
        }

        // 10. MEU PERFIL E FAVORITOS
        function viewProfile() {
            const u = state.user;
            const favList = SPORTS.filter(s => state.favorites.includes(s.id));
            return `
                <div class="max-w-6xl mx-auto px-4 py-12">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 border border-slate-200 dark:border-slate-700 shadow-sm mb-8 flex flex-col md:flex-row justify-between items-center">
                        <div>
                            <h1 class="text-3xl font-extrabold">${u.name}</h1>
                            <p class="text-slate-500">${u.email}</p>
                        </div>
                        <button onclick="state.quizStep=1; navigate('register')" class="mt-4 md:mt-0 px-4 py-2 bg-blue-100 text-blue-700 font-bold rounded-xl focus-visible:ring-4 focus-visible:ring-blue-500">Refazer Questionário</button>
                    </div>
                    <h2 class="text-2xl font-extrabold mb-6">Meus Esportes Favoritos</h2>
                    ${favList.length > 0 ? `<div class="grid grid-cols-1 md:grid-cols-3 gap-6">${favList.map(s => createSportCard(s)).join('')}</div>` : `<p class="text-slate-500 p-8 border border-dashed border-slate-300 rounded-xl text-center">Você ainda não favoritou nenhuma modalidade. Clique no coração no catálogo!</p>`}
                </div>
            `;
        }

        // ============================================================================
        // COMPONENTES: CARDS, FAVORITOS E MODAL DETALHADO (DOM INTERACTION)
        // ============================================================================
        function createSportCard(sport, isRec = false) {
            const isFav = state.favorites.includes(sport.id);
            return `
                <article class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden flex flex-col hover:shadow-xl transition relative">
                    <img src="${sport.image}" alt="Foto ilustrativa de ${sport.name}" class="w-full h-48 object-cover bg-slate-200">
                    <button onclick="toggleFav('${sport.id}')" aria-pressed="${isFav}" aria-label="${isFav?'Remover':'Adicionar'} ${sport.name} aos favoritos" class="absolute top-3 right-3 w-10 h-10 rounded-full bg-white/90 flex items-center justify-center shadow focus-visible:ring-4 focus-visible:ring-blue-500">
                        <i data-lucide="heart" class="w-5 h-5 ${isFav?'fill-red-500 text-red-500':'text-slate-500'}"></i>
                    </button>
                    <div class="p-6 flex-grow flex flex-col">
                        <span class="text-xs font-bold text-teal-600 mb-1">${sport.category} • ${sport.disabilityLabel}</span>
                        <h3 class="text-xl font-extrabold mb-2">${sport.name}</h3>
                        <p class="text-sm text-slate-600 dark:text-slate-400 mb-4 flex-grow">${sport.shortDesc}</p>
                        ${isRec ? `<div class="mb-4 bg-emerald-50 text-emerald-800 text-xs font-bold px-3 py-2 rounded">Compatibilidade: ${sport.score}%</div>` : ''}
                        <button aria-label="Abrir detalhes de ${sport.name}" onclick="openSportModal('${sport.id}')" class="w-full py-3 bg-slate-100 hover:bg-blue-600 hover:text-white dark:bg-slate-800 dark:hover:bg-blue-600 text-slate-800 dark:text-white font-bold rounded-xl transition focus-visible:ring-4 focus-visible:ring-blue-500">Ver Detalhes</button>
                    </div>
                </article>
            `;
        }

        function toggleFav(id) {
            if (state.favorites.includes(id)) { state.favorites = state.favorites.filter(f => f !== id); } 
            else { state.favorites.push(id); }
            localStorage.setItem('arena_favs', JSON.stringify(state.favorites));
            renderMain();
            announceToScreenReader('Lista de favoritos atualizada.');
        }

        let lastFocus = null;
        function openSportModal(id) {
            const s = SPORTS.find(x => x.id === id);
            if (!s) return;
            lastFocus = document.activeElement;
            const modal = document.getElementById('sport-modal');
            const content = document.getElementById('sport-modal-content');
            
            content.innerHTML = `
                <div class="relative h-64">
                    <img src="${s.image}" alt="" aria-hidden="true" class="w-full h-full object-cover">
                    <div class="absolute top-4 right-4 flex gap-2">
                        <button onclick="closeSportModal()" id="btn-close-modal" aria-label="Fechar janela" class="w-10 h-10 rounded-full bg-slate-900/80 text-white flex items-center justify-center hover:bg-black focus-visible:ring-4 focus-visible:ring-yellow-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-slate-950 p-6 text-white">
                        <h2 id="modal-title" class="text-3xl font-extrabold">${s.name}</h2>
                    </div>
                </div>
                <div class="p-6 space-y-6 text-sm">
                    <p><strong>História:</strong> ${s.history}</p>
                    <p><strong>Como Funciona:</strong> ${s.howItWorks}</p>
                    <p><strong>Regras Básicas:</strong> ${s.rules}</p>
                    <p><strong>Equipamentos:</strong> ${s.equipment}</p>
                    <p><strong>Adaptações da ONG:</strong> ${s.adaptations}</p>
                    <div class="p-4 bg-teal-50 dark:bg-teal-900/20 text-teal-900 dark:text-teal-100 rounded-xl"><strong>Benefícios para Saúde:</strong> ${s.benefits}</div>
                </div>
            `;
            modal.classList.remove('hidden');
            lucide.createIcons();
            document.getElementById('btn-close-modal').focus();
            announceToScreenReader(`Modal aberto para ${s.name}`);
            
            // TTS lê o modal automaticamente se estiver ativado
            speakText(`Você abriu os detalhes de ${s.name}. História: ${s.history}. Funcionamento: ${s.howItWorks}`);
        }

        function closeSportModal() {
            document.getElementById('sport-modal').classList.add('hidden');
            if (synth) synth.cancel();
            announceToScreenReader('Modal fechado.');
            if (lastFocus) lastFocus.focus();
        }

        // Fechar modal com ESC
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSportModal(); });

        // ============================================================================
        // ENGINE DE VOZ COM LEITURA DO MOUSE (HOVER TTS)
        // ============================================================================
        let isAudioActive = false;
        const synth = window.speechSynthesis;
        let hoverTimeout = null;
        let lastHoveredElement = null;

        function speakText(text) {
            if (!synth || !text) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05;
            synth.speak(utterance);
        }

        function toggleAudioReader() {
            isAudioActive = !isAudioActive;
            const btn = document.getElementById('btn-audio');
            const label = document.getElementById('btn-audio-label');
            if (isAudioActive) {
                btn.setAttribute('aria-pressed', 'true');
                btn.classList.add('bg-emerald-600', 'text-white');
                if (label) label.textContent = 'Voz Ativa';
                announceToScreenReader('Motor de voz e mouse ativado.');
                readCurrentScreen();
            } else {
                btn.setAttribute('aria-pressed', 'false');
                btn.classList.remove('bg-emerald-600', 'text-white');
                if (label) label.textContent = 'Ouvir Voz e Mouse';
                synth.cancel();
                announceToScreenReader('Voz desativada.');
            }
        }
        function repeatAudio() { readCurrentScreen(); }
        function readCurrentScreen() {
            if (!isAudioActive) return;
            setTimeout(() => {
                const el = document.getElementById('app-content');
                if (el) speakText(el.innerText.trim());
            }, 300);
        }
        function announceToScreenReader(msg) {
            const a = document.getElementById('a11y-announcer');
            if (a) { a.textContent = msg; setTimeout(() => a.textContent = '', 3000); }
        }

        // LÓGICA DE HOVER DO MOUSE (Lê elementos interativos e formulários)
        document.addEventListener('mouseover', (e) => {
            if (!isAudioActive || !synth) return;
            // Intercepta links, botões, parágrafos, inputs, etc.
            const target = e.target.closest('button, a, h1, h2, h3, h4, p, label, img, input, textarea, select, span, article');
            if (!target || target === lastHoveredElement) return;
            lastHoveredElement = target;

            // Prioriza ARIA-LABEL ou ALT (imagens)
            let txt = target.getAttribute('aria-label') || target.alt || target.title;
            
            if (!txt) {
                if (['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName)) {
                    // Pega o label associado ao campo para fazer sentido sonoro
                    const label = document.querySelector(`label[for="${target.id}"]`);
                    txt = "Campo de formulário: " + (label ? label.innerText : "") + ". " + (target.placeholder || "");
                } else {
                    txt = target.innerText || target.textContent;
                }
            }
            if (txt) {
                clearTimeout(hoverTimeout);
                // Aguarda meio segundo para não poluir caso o mouse passe rápido
                hoverTimeout = setTimeout(() => speakText(txt.replace(/→|←/g, '').trim()), 500);
            }
        });
        document.addEventListener('mouseout', (e) => {
            const target = e.target.closest('button, a, h1, p, label, img, input, textarea, select, span, article');
            if (!target) return;
            clearTimeout(hoverTimeout);
            lastHoveredElement = null;
        });
        window.addEventListener('beforeunload', () => { if (synth) synth.cancel(); });

        // Acessibilidade Visual
        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            document.documentElement.classList.toggle('dark', state.darkMode);
        }
        function toggleHighContrast() {
            state.highContrast = !state.highContrast;
            document.body.classList.toggle('high-contrast', state.highContrast);
        }
        function adjustFont(delta) {
            state.fontSize = Math.min(Math.max(state.fontSize + delta, 13), 22);
            document.documentElement.style.setProperty('--font-scale', state.fontSize + 'px');
        }
        function resetFont() { adjustFont(16 - state.fontSize); }

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            document.documentElement.style.setProperty('--font-scale', state.fontSize + 'px');
            renderNav();
            navigate('home');
        });
    </script>
</body>
</html>
